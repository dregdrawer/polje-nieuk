name: windows build

on:
  push:
    branches: [ main ]
    paths: [ 'windows/**', 'Vendor/mutable/**', '.github/workflows/windows.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (clang-cl, x64)
        run: cmake -S windows -B windows/build -A x64 -T ClangCL
      - name: Build
        run: cmake --build windows/build --config Release --parallel
      - name: Engine matches the Mac app
        shell: pwsh
        run: |
          $r = Get-ChildItem -Recurse windows/build/pnrender_artefacts/Release -Filter "pnrender.exe" | Select-Object -First 1
          & $r.FullName windows/tests/every-device.json 6 > every.txt
          python windows/tests/compare.py windows/tests/every-device.mac.txt every.txt
          & $r.FullName windows/tests/stress-95.json 8 > stress.txt
          python windows/tests/compare.py windows/tests/stress-95.mac.txt stress.txt
      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse windows/build/PoljeNieuk_artefacts/Release -Filter "*.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force out/polje-nieuk | Out-Null
          Copy-Item $exe.FullName "out/polje-nieuk/polje nieuk.exe"
          Compress-Archive -Path out/polje-nieuk -DestinationPath polje-nieuk-windows-x64.zip
      - name: Run it and take a screenshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:APPDATA/polje nieuk" | Out-Null
          Copy-Item windows/tests/every-device.json "$env:APPDATA/polje nieuk/autosave.json"
          $p = Start-Process -FilePath "out/polje-nieuk/polje nieuk.exe" -PassThru
          Start-Sleep -Seconds 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("windows-screenshot.png")
          "running: $(-not $p.HasExited)  cpu seconds: $($p.TotalProcessorTime.TotalSeconds)" | Tee-Object windows-run.txt
          if ($p.HasExited) { "exit code $($p.ExitCode)" | Tee-Object -Append windows-run.txt; exit 1 }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: polje-nieuk-windows-x64
          path: polje-nieuk-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: |
            windows-screenshot.png
            windows-run.txt
